<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiong Shi - Contact</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Aptos', 'Segoe UI', 'Ubuntu', sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            color: black;
            overflow-x: hidden;
        }

        /* 顶部区域 */
        .header-section {
            width: 100%;
            border-bottom: 1px solid #eee;
            padding-top: 50px;
            margin-bottom: 40px;
            position: relative;
        }

        #main-title {
            text-align: center;
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-style: italic;
            font-weight: bold;
            margin: 0;
            letter-spacing: -1px;
        }

        .nav-container {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            position: relative;
        }

        /* 导航占屏幕 55% */
        .navigation {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 55%;
            list-style: none;
            padding: 25px 0;
            margin: 0 auto;
        }

        .navigation li {
            flex: 1;
            margin: 0;
            text-align: center;
        }

        .navigation a {
            text-decoration: none;
            color: inherit;
            font-weight: 500;
            font-size: 1.8rem;
            transition: 0.3s;
            white-space: nowrap;
        }

        .navigation a:hover {
            text-decoration: underline;
            opacity: 0.7;
        }

        /* 手机端菜单按钮 */
        .menu-toggle {
            display: none;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1000;
        }

        .hamburger-lines {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 20px;
            width: 28px;
        }

        .line {
            height: 3px;
            width: 100%;
            background: black;
            border-radius: 10px;
        }

        /* 与其他页面相同的主体边距 */
        .main-content {
            width: 100%;
            margin: 0 auto;
            padding-inline: clamp(20px, 4vw, 80px);
        }

        .contact-card {
            width: 100%;
            max-width: 1200px;
            margin: 50px auto;
            padding: 60px 0;
            text-align: center;
        }

        .contact-label {
            display: block;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* 两个邮箱各占一排 */
        .contact-value {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            font-size: 1.4rem;
        }

        .contact-value a {
            max-width: 100%;
            color: black;
            text-decoration: none;
            border-bottom: 1px solid #ccc;
            overflow-wrap: anywhere;
            transition: 0.3s;
        }

        .contact-value a:hover {
            border-bottom-color: black;
        }

        /* 页脚 */
        footer {
            text-align: center;
            margin-top: 100px;
            font-size: 0.85em;
            color: #999;
            padding-bottom: 40px;
        }

        #busuanzi_container_site_pv {
            margin-left: 10px;
        }

        /* 手机端 */
        @media (max-width: 768px) {
            .header-section {
                padding-top: 15px;
                padding-bottom: 15px;
                margin-bottom: 25px;
            }

            #main-title {
                text-align: left;
                padding-left: 20px;
                font-size: 2.5rem;
            }

            .menu-toggle {
                display: block;
            }

            .navigation {
                display: none;
                flex-direction: column;
                align-items: stretch;
                text-align: left;
                padding: 15px 25px;
                margin: 0;
                background: #fff;
                width: 100%;
                position: absolute;
                top: 100%;
                left: 0;
                z-index: 500;
                box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
                border-top: 1px solid #eee;
            }

            .navigation.active {
                display: flex;
            }

            .navigation li {
                flex: none;
                margin: 12px 0;
                text-align: left;
            }

            .navigation a {
                font-size: 1.2rem;
                display: block;
                width: 100%;
            }

            .contact-card {
                margin: 30px auto;
                padding: 40px 5px;
            }

            .contact-value {
                font-size: 1.2rem;
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="header-section">
        <div class="nav-container">
            <h1 id="main-title">Xiong Shi</h1>

            <button
                class="menu-toggle"
                onclick="toggleMenu()"
                aria-label="Toggle navigation"
                aria-controls="navMenu"
                aria-expanded="false"
            >
                <span class="hamburger-lines">
                    <span class="line"></span>
                    <span class="line"></span>
                    <span class="line"></span>
                </span>
            </button>

            <ul class="navigation" id="navMenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publication.html">Publication</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="contact-card">
            <span class="contact-label">Email</span>

            <div class="contact-value">
                <a href="mailto:shixiongsnnu@gmail.com">
                    shixiongsnnu@gmail.com
                </a>
                <a href="mailto:xiong.shi@pku.edu.cn">
                    xiong.shi@pku.edu.cn
                </a>
            </div>
        </div>
    </div>

    <footer>
        &copy; <span id="year"></span> Xiong Shi
        <span id="busuanzi_container_site_pv" style="display: none;">
            | <span id="busuanzi_value_site_pv"></span> views
        </span>
    </footer>

    <script
        async
        src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"
    ></script>

    <script>
        // 自动年份
        document.getElementById('year').textContent =
            new Date().getFullYear();

        // 手机菜单
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            const button = document.querySelector('.menu-toggle');
            const isOpen = menu.classList.toggle('active');

            button.setAttribute('aria-expanded', String(isOpen));
        }
    </script>
</body>
</html>
